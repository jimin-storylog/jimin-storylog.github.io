<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Travel 렌더링 점검 (임시)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body id="top">
  <main>
    <!-- ── Travel ───────────────────────────────────────── -->
    <section class="section travel" id="travel" aria-labelledby="travelTitle">
      <div class="section-head">
        <p class="section-index">02</p>
        <div class="section-head__text">
          <h2 class="section-title" id="travelTitle">Travel</h2>
          <p class="section-desc">
            도시의 골목부터 산과 순례길까지, 길 위에서 마주한 시간을 모았습니다.
          </p>
        </div>
      </div>

      <div class="filters filters--travel" id="travelFilters" role="group" aria-label="여행지"></div>

      <div class="gallery" id="travelGallery"></div>

      <p class="work-status" id="travelStatus" role="status">여정을 불러오는 중…</p>
    </section>

    <div class="gallery" id="gallery" hidden></div>
  </main>
  <!-- ── 작품 뷰어 ──────────────────────────────────────── -->
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" hidden>
    <div class="viewer__inner">
      <aside class="viewer__rail">
        <p class="viewer__year" id="viewerYear"></p>
        <h2 class="viewer__title" id="viewerTitle"></h2>
        <p class="viewer__contrib" id="viewerContrib"></p>
      </aside>

      <div class="viewer__stage">
        <div class="viewer__canvas">
          <img class="viewer__img" id="viewerImg" alt="">
        </div>
        <p class="viewer__cap" id="viewerCap"></p>
        <button class="viewer__nav viewer__nav--prev" id="viewerPrev" type="button" aria-label="이전 사진 (←)">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
            <path d="M15 4L7 12l8 8" fill="none" stroke="currentColor" stroke-width="1.2"/>
          </svg>
        </button>
        <button class="viewer__nav viewer__nav--next" id="viewerNext" type="button" aria-label="다음 사진 (→)">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
            <path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="1.2"/>
          </svg>
        </button>
      </div>

      <div class="viewer__foot">
        <div class="viewer__thumbs" id="viewerThumbs" role="group" aria-label="이 작품의 사진"></div>
        <p class="viewer__count" aria-live="polite">
          <span class="viewer__cur" id="viewerCur">01</span><span class="viewer__sep">/</span><span class="viewer__total" id="viewerTotal">01</span>
        </p>
      </div>
    </div>

    <button class="viewer__close" id="viewerClose" type="button" aria-label="닫기 (ESC)">
      <span aria-hidden="true">Close</span>
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
        <path d="M4 4L20 20M20 4L4 20" fill="none" stroke="currentColor" stroke-width="1.2"/>
      </svg>
    </button>
  </div>

  <script>
    /* 임시 점검용 — data/*.json 세 개만 이 파일 안의 가짜 데이터로 바꿔 끼운다 */
    (function () {
      var travel = {"updated": "2026-11-25T15:53:14.000Z", "journeys": [{"id": "tokyo-japan", "label": "도쿄-일본", "title": "도쿄", "region": "일본", "year": "2024", "desc": "골목과 카페, 겨울의 도쿄", "cover": "assets/uploads/work-vhwk5z2l-1795569293298-1.jpg", "photos": [{"src": "assets/uploads/work-vhwk5z2l-1795569293298-1.jpg", "caption": "골목의 오후", "w": 1600, "h": 1067}, {"src": "assets/uploads/drama-still-1795569293298-2.jpg", "caption": "", "w": 1136, "h": 1600}, {"src": "assets/uploads/work-zhbqpt15-1795573055371-1.jpg", "caption": "", "w": 1600, "h": 1067}, {"src": "assets/uploads/film-stage-02-1795574706958-9.jpg", "caption": "", "w": 1067, "h": 1600}]}, {"id": "new-york-usa", "label": "뉴욕-미국", "title": "뉴욕", "region": "미국", "year": "", "desc": "", "cover": "", "photos": []}, {"id": "buenos-aires-argentina", "label": "부에노스아이레스-아르헨티나", "title": "부에노스아이레스", "region": "아르헨티나", "year": "", "desc": "", "cover": "", "photos": []}, {"id": "fjallraven-classic-sweden-turkiye", "label": "피엘라벤 클래식-스웨덴•튀르키예", "title": "피엘라벤 클래식", "region": "스웨덴•튀르키예", "year": "", "desc": "", "cover": "", "photos": []}, {"id": "camino-de-santiago-spain-portugal-netherlands-greece", "label": "산티아고 순례길-스페인•포르투갈•네덜란드•그리스", "title": "산티아고 순례길", "region": "스페인•포르투갈•네덜란드•그리스", "year": "2023", "desc": "800km, 걷는 동안의 기록", "cover": "assets/uploads/drama-still-1795569293298-2.jpg", "photos": [{"src": "assets/uploads/drama-still-1795569293298-2.jpg", "caption": "", "w": 1136, "h": 1600}, {"src": "assets/uploads/work-zhbqpt15-1795573055371-1.jpg", "caption": "", "w": 1600, "h": 1067}, {"src": "assets/uploads/film-stage-02-1795574706958-9.jpg", "caption": "", "w": 1067, "h": 1600}]}, {"id": "annapurna-trek-nepal-india-sri-lanka-indonesia", "label": "안나푸르나 트레킹-네팔•인도•스리랑카•인도네시아", "title": "안나푸르나 트레킹", "region": "네팔•인도•스리랑카•인도네시아", "year": "", "desc": "", "cover": "", "photos": []}]};
      var real = window.fetch;
      window.fetch = function (url, opts) {
        var u = String(url);
        function json(body) {
          return Promise.resolve(new Response(JSON.stringify(body), { status: 200, headers: { "Content-Type": "application/json" } }));
        }
        if (u.indexOf("data/travel.json") === 0) return json(travel);
        if (u.indexOf("data/works.json") === 0) return json({ works: [] });
        if (u.indexOf("data/filmography.json") === 0) return json({ categories: [] });
        return real(url, opts);
      };
    })();
  </script>
  <script src="script.js?v=10"></script>
</body>
</html>
